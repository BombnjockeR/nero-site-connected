<style>
/* ===== On-Going Event badge + modal ===== */
.oge-badge{position:fixed;left:50%;transform:translateX(-50%);top:96px;z-index:40;width:104px;cursor:pointer;border:none;background:none;padding:0;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));transition:transform .18s}
.oge-badge:hover{transform:translateX(-50%) translateY(-3px) scale(1.03)}
.oge-badge img{width:100%;display:block;animation:oge-bob 3.4s ease-in-out infinite}
.oge-badge .oge-ping{position:absolute;top:6px;right:10px;width:13px;height:13px;border-radius:50%;background:#ff5252;
  border:2px solid #1a1206;box-shadow:0 0 0 0 rgba(255,82,82,.6);animation:oge-pulse 1.8s infinite}
@keyframes oge-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes oge-pulse{0%{box-shadow:0 0 0 0 rgba(255,82,82,.6)}70%{box-shadow:0 0 0 9px rgba(255,82,82,0)}100%{box-shadow:0 0 0 0 rgba(255,82,82,0)}}
@media(max-width:640px){.oge-badge{width:74px;top:78px}}

.oge-bg{position:fixed;inset:0;z-index:120;background:rgba(3,6,12,.82);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:24px}
.oge-bg.show{display:flex}
.oge-modal{position:relative;width:min(1000px,96vw);height:min(88vh,900px);background:#0b1220;border:1px solid var(--line);
  border-radius:18px;box-shadow:0 40px 100px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden}
.oge-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--tline);flex-shrink:0}
.oge-top h2{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px}
.oge-top h2 i{color:var(--gold);font-size:20px}
.oge-close{background:rgba(255,255,255,.06);border:1px solid var(--tline);color:var(--muted);width:38px;height:38px;
  border-radius:10px;font-size:24px;line-height:1;cursor:pointer;flex-shrink:0;transition:.15s}
.oge-close:hover{background:#ff5252;color:#fff;border-color:#ff5252}

.oge-viewport{position:relative;flex:1;overflow:hidden}
.oge-track{display:flex;height:100%;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.oge-slide{min-width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.oge-banner{width:100%;display:block;background:#0b1220}
.oge-body{padding:20px 26px 30px}
.oge-etitle{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:.2px}
.oge-period{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold-soft);
  background:rgba(228,184,75,.12);border:1px solid rgba(228,184,75,.35);border-radius:8px;padding:5px 11px;margin-bottom:14px}
.oge-body p{font-size:14px;line-height:1.65;color:var(--text);margin:0 0 12px}
.oge-body .lead{color:var(--muted)}
.oge-body h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);font-weight:700;margin:20px 0 9px}
.oge-body ul{margin:0 0 12px;padding:0;list-style:none}
.oge-body ul li{position:relative;padding:5px 0 5px 22px;font-size:13.5px;line-height:1.5;color:var(--text);border-bottom:1px solid rgba(255,255,255,.06)}
.oge-body ul li:before{content:'';position:absolute;left:4px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.oge-body ul.plain li{padding-left:0}.oge-body ul.plain li:before{display:none}
.oge-body a{color:var(--gold);text-decoration:underline;text-underline-offset:2px;word-break:break-word}
.oge-links{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.oge-lbtn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid var(--tline);
  color:var(--text);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;text-decoration:none;transition:.15s}
.oge-lbtn:hover{border-color:var(--line);background:rgba(255,255,255,.1)}
.oge-lbtn.fb:hover{background:#1877f2;border-color:#1877f2;color:#fff}
.oge-lbtn.ig:hover{background:#d6249f;border-color:#d6249f;color:#fff}
.oge-lbtn.dc:hover{background:#5865f2;border-color:#5865f2;color:#fff}
.oge-note{font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--tline);
  border-radius:10px;padding:11px 13px;line-height:1.55;margin-top:8px}
.oge-prize{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 12px}
.oge-prize .pz{background:rgba(228,184,75,.07);border:1px solid rgba(228,184,75,.25);border-radius:8px;padding:8px 11px;font-size:13px;color:var(--text)}
@media(max-width:640px){.oge-prize{grid-template-columns:1fr}.oge-body{padding:16px 16px 26px}.oge-etitle{font-size:18px}}

.oge-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:44px;height:44px;border-radius:50%;

.oge-nav:hover{background:var(--gold);color:#1a1206}
.oge-prev{left:12px}.oge-next{right:12px}
@media(max-width:640px){.oge-nav{width:36px;height:36px;font-size:18px}}

/* dots + autoplay bar */
.oge-foot{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px;border-top:1px solid var(--tline);flex-shrink:0}
.oge-dots{display:flex;gap:8px}
.oge-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);border:none;cursor:pointer;padding:0;transition:.15s}
.oge-dot.on{background:var(--gold);width:26px;border-radius:5px}

var ogeIdx=0, ogeTimer=null;
function ogeBuild(){
  var track=document.getElementById('oge-track'), dots=document.getElementById('oge-dots');
  track.innerHTML=OGE_EVENTS.map(function(e){
    return '<div class="oge-slide"><img class="oge-banner" src="'+e.img+'" alt="'+e.title+'" loading="lazy">'+
      '<div class="oge-body"><h3 class="oge-etitle">'+e.title+'</h3>'+
      '<div class="oge-period"><i class="ti ti-calendar-event"></i> '+e.period+'</div>'+e.html+'</div></div>';
  }).join('');
  dots.innerHTML=OGE_EVENTS.map(function(_,i){return '<button class="oge-dot'+(i===0?' on':'')+'" onclick="ogeSet('+i+')" aria-label="Event '+(i+1)+'"></button>';}).join('');
}
function ogeApply(){
  document.getElementById('oge-track').style.transform='translateX(-'+(ogeIdx*100)+'%)';
  Array.prototype.forEach.call(document.querySelectorAll('.oge-dot'),function(d,i){d.classList.toggle('on',i===ogeIdx);});
  // reset each slide scroll to top on change
  var s=document.querySelectorAll('.oge-slide')[ogeIdx]; if(s) s.scrollTop=0;
}
function ogeSet(i){ ogeIdx=(i+OGE_EVENTS.length)%OGE_EVENTS.length; ogeApply(); ogeRestart(); }
function ogeGo(d){ ogeSet(ogeIdx+d); }
function ogeRestart(){ if(ogeTimer){clearInterval(ogeTimer);ogeTimer=null;} ogeTimer=setInterval(function(){ogeIdx=(ogeIdx+1)%OGE_EVENTS.length;ogeApply();},5000); }
function ogeOpen(){
  document.getElementById('oge-bg').classList.add('show');
  document.body.style.overflow='hidden';
  ogeIdx=0; ogeApply();
  ogeRestart();
}
function ogeClose(){
  document.getElementById('oge-bg').classList.remove('show');
  document.body.style.overflow='';
  if(ogeTimer){clearInterval(ogeTimer);ogeTimer=null;}
}
document.addEventListener('keydown',function(e){
  if(!document.getElementById('oge-bg').classList.contains('show')) return;
  if(e.key==='Escape') ogeClose();
  else if(e.key==='ArrowRight') ogeGo(1);
  else if(e.key==='ArrowLeft') ogeGo(-1);
});
/* pause auto-advance while the pointer is over the modal so long text is readable */
(function(){
  var bg=document.getElementById('oge-bg');
  var modal=bg.querySelector('.oge-modal');
  modal.addEventListener('mouseenter',function(){ if(ogeTimer){clearInterval(ogeTimer);ogeTimer=null;} });
  modal.addEventListener('mouseleave',function(){ ogeRestart(); });
})();
ogeBuild();
</script>
