<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeny Statistics — NeRO</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
</head><body class="page">
<div class="pagebg"><video autoplay muted loop playsinline><source src="../assets/nero_landingpage.mp4" type="video/mp4"></video><div class="pagebg-veil"></div></div>
<div id="app">
<header class="sitehead">
  <img class="hd-logo" src="../assets/logo.png" alt="Home" title="Home" onclick="location.href='../'">
  <nav class="hd-tabs"><a class="tab" href="../wiki/index.html">Wiki</a><a class="tab" href="../pages/stat-woe.html">WoE</a><a class="tab" href="../pages/stat-pvp.html">PvP</a><a class="tab" href="../pages/stat-mvp.html">MVP</a><a class="tab on" href="../pages/stat-zeny.html">Zeny</a><a class="tab" href="../pages/marketplace.html">Market</a></nav>
  <div class="hd-right">
    <div class="hd-status"><span class="hd-time" id="hd-time">Server time: —</span><div class="hd-pill" id="hd-pill"><b id="online-num">—</b><span>Players</span><span class="hd-sep">|</span><b id="merchant-num">—</b><span>Merchants</span></div><span class="hd-peaklbl">peak player <b id="peak-num">—</b></span></div>
    <div class="hd-acct" id="hd-acct"></div>
  </div>
</header>
<div class="wrap">
  <h1 class="pg-title">Zeny Statistics</h1>
  <p class="subtitle">Top zeny holders on NeRO.</p>
  <div class="searchbar"><i class="ti ti-search"></i>
    <input id="tblsearch" placeholder="Search player name..." oninput="filterTable()">
    <span class="hits" id="hits"></span></div>
  <div class="tbl-wrap"><table class="stat" id="stbl" data-api="zeny"><thead><tr><th>#</th><th>Player</th><th>Zeny Holdings</th><th>Base Level</th><th>Guild</th></tr></thead><tbody><tr class="norow-row"><td class="norow" colspan="5">Loading…</td></tr></tbody></table></div>
</div>
<div class="backdrop" id="backdrop" onclick="closePanel()"></div>
<aside class="panel" id="panel">
  <div class="panel-head"><i id="pnl-icon" class="ti"></i><h2 id="pnl-title"></h2>
    <button class="panel-close" onclick="closePanel()">&times;</button></div>
  <div class="panel-body" id="pnl-body"></div>
</aside>
</div>
<div class="music" id="music">
  <button class="mus-toggle" id="mus-toggle" title="Play / pause"><i class="ti ti-player-play"></i></button>
  <div class="mus-mid">
    <div class="mus-track" id="mus-track">—</div>
  </div>
  <button class="mus-next" id="mus-next" title="Next track"><i class="ti ti-player-track-next"></i></button>
  <button class="mus-list" id="mus-list-btn" title="Playlist"><i class="ti ti-playlist"></i></button>
  <div class="mus-panel" id="mus-panel"></div>
</div>
<audio id="bgm" preload="auto"></audio>
<script src="../js/data.js"></script><script src="../js/wiki-index.js"></script><script src="../js/app.js"></script>
</body></html>
